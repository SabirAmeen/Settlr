name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run unit tests
      run: npm test

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run E2E tests
      run: npm run test:e2e
      env:
        VITE_FIREBASE_API_KEY: "AIzaSyFakeKeyForCITestingPurposeOnly_abc123"
        VITE_FIREBASE_AUTH_DOMAIN: "settlr-ci-mock.firebaseapp.com"
        VITE_FIREBASE_PROJECT_ID: "settlr-ci-mock"
        VITE_FIREBASE_STORAGE_BUCKET: "settlr-ci-mock.firebasestorage.app"
        VITE_FIREBASE_MESSAGING_SENDER_ID: "123456789012"
        VITE_FIREBASE_APP_ID: "1:123456789012:web:fakeappidforci"

    - name: Build application
      run: npm run build
      env:
        VITE_FIREBASE_API_KEY: "AIzaSyFakeKeyForCITestingPurposeOnly_abc123"
        VITE_FIREBASE_AUTH_DOMAIN: "settlr-ci-mock.firebaseapp.com"
        VITE_FIREBASE_PROJECT_ID: "settlr-ci-mock"
        VITE_FIREBASE_STORAGE_BUCKET: "settlr-ci-mock.firebasestorage.app"
        VITE_FIREBASE_MESSAGING_SENDER_ID: "123456789012"
        VITE_FIREBASE_APP_ID: "1:123456789012:web:fakeappidforci"
